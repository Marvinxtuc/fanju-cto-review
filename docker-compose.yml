services:
  postgres:
    image: postgres:16-alpine
    container_name: timeleft-shanghai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: timeleft
      POSTGRES_PASSWORD: timeleft_dev_password
      POSTGRES_DB: timeleft_shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timeleft -d timeleft_shanghai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
